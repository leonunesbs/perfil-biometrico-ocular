      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

\u002Fspan><\u002Fdiv><div style=\"font-size:17px;color:var(--muted,#6f6f6c);margin-top:10px;\">pacientes<\u002Fdiv><\u002Fdiv>\n    <div class=\"reveal\" style=\"animation-delay:.1s;text-align:center;\"><div class=\"lp-statnum\" style=\"font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:600;line-height:1;color:var(--blue,#2e74ab);letter-spacing:-2px;font-variant-numeric:tabular-nums;\"><span data-countup=\"63\" data-dec=\"0\" style=\"display:inline-block;min-width:2ch;text-align:right;\">63<\u002Fspan><span style=\"font-size:30px;color:var(--muted,#6f6f6c);\"> anos<\u002Fspan><\u002Fdiv><div style=\"font-size:17px;color:var(--muted,#6f6f6c);margin-top:10px;\">idade média<\u002Fdiv><\u002Fdiv>\n    <div class=\"reveal\" style=\"animation-delay:.15s;text-align:center;\"><div class=\"lp-statnum\" style=\"font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:600;line-height:1;color:var(--blue,#2e74ab);letter-spacing:-2px;font-variant-numeric:tabular-nums;\"><span data-countup=\"53\" data-dec=\"0\" style=\"display:inline-block;min-width:2ch;text-align:right;\">53<\u002Fspan><span style=\"font-size:30px;color:var(--muted,#6f6f6c);\">%<\u002Fspan><\u002Fdiv><div style=\"font-size:17px;color:var(--muted,#6f6f6c);margin-top:10px;\">mulheres<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"estudo\" class=\"lp-sec\" style=\"padding:96px 40px;background:var(--bg,#ffffff);transition:background .35s ease;\">\n  <div style=\"max-width:900px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:22px;\">O ESTUDO<\u002Fdiv>\n    <p class=\"reveal lp-lead\" style=\"font-family:'IBM Plex Serif',serif;font-size:33px;line-height:1.42;font-weight:400;color:var(--ink,#222220);margin-bottom:44px;\">A precisão da cirurgia de catarata depende da biometria — e faltam dados normativos brasileiros, sobretudo no Nordeste e na rede pública. Este trabalho descreve o perfil biométrico local e estabelece intervalos de referência para apoiar a triagem e o controle de qualidade das medidas.<\u002Fp>\n    <div class=\"reveal\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n      <div style=\"border-top:3px solid var(--bfill,#3f86bb);padding-top:18px;\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:8px;\">DESENHO<\u002Fdiv><div style=\"font-size:18px;color:var(--body,#3a3a38);line-height:1.4;\">Transversal, descritivo, retrospectivo<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:3px solid var(--bfill,#3f86bb);padding-top:18px;\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:8px;\">INSTRUMENTO<\u002Fdiv><div style=\"font-size:18px;color:var(--body,#3a3a38);line-height:1.4;\">IOLMaster 700 · swept-source OCT<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:3px solid var(--ofill,#d98f52);padding-top:18px;\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--otext,#c2762f);font-weight:600;margin-bottom:8px;\">REFERÊNCIA<\u002Fdiv><div style=\"font-size:18px;color:var(--body,#3a3a38);line-height:1.4;\">Percentis 2,5–97,5 · CLSI EP28-A3<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;background:var(--bg,#ffffff);transition:background .35s ease;\">\n  <div id=\"eye-track\" style=\"height:440vh;position:relative;\">\n    <div id=\"eye-stage\" style=\"position:sticky;top:0;height:100vh;display:flex;align-items:center;overflow:hidden;\">\n      <div class=\"lp-eyegrid\" style=\"max-width:1180px;margin:0 auto;padding:0 40px;width:100%;display:grid;grid-template-columns:380px 1fr;gap:56px;align-items:center;\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:22px;\">O QUE A BIOMETRIA MEDE<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--faint,#9b9b97);letter-spacing:1px;margin-bottom:12px;\">{{ eyeCounter }}<\u002Fdiv>\n          <h2 class=\"lp-eyeh2\" style=\"font-family:'IBM Plex Serif',serif;font-size:42px;font-weight:600;color:var(--ink,#1b1b1a);line-height:1.05;margin-bottom:12px;min-height:92px;\">{{ eyeName }}<\u002Fh2>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;color:var(--otext,#c2762f);margin-bottom:18px;\">{{ eyeVal }}<\u002Fdiv>\n          <p class=\"lp-eyedesc\" style=\"font-size:19px;color:var(--muted,#5a5a57);line-height:1.5;min-height:86px;\">{{ eyeDesc }}<\u002Fp>\n          <div style=\"display:flex;gap:9px;margin-top:22px;\">\n            <sc-for list=\"{{ eyeDots }}\" as=\"d\" hint-placeholder-count=\"5\"><span style=\"{{ d.style }}\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:30px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--faint,#9b9b97);\">↓ ROLE PARA PERCORRER<\u002Fdiv>\n        <\u002Fdiv>\n        <div>{{ eyeChart }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"perfil\" class=\"lp-sec\" style=\"background:var(--bg2,#f7f7f4);padding:96px 40px;border-top:1px solid var(--line,#e8e8e3);border-bottom:1px solid var(--line,#e8e8e3);transition:background .35s ease;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:18px;\">EXPLORE · PERFIL BIOMÉTRICO<\u002Fdiv>\n    <div class=\"reveal\" style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;padding:7px 14px;border:1px solid var(--line,#e8e8e3);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:1px;color:var(--otext,#c2762f);background:var(--panel,#ffffff);\"><span class=\"lp-statusdot\" style=\"width:8px;height:8px;border-radius:50%;background:var(--ofill,#d98f52);display:inline-block;flex:none;\"><\u002Fspan>{{ liveLabel }}<\u002Fdiv>\n    <h2 class=\"revealT lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:50px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:18px;\">Seis parâmetros, uma população<\u002Fh2>\n    <p class=\"reveal\" style=\"font-size:21px;color:var(--muted,#5a5a57);line-height:1.5;max-width:780px;margin-bottom:48px;\">Role para revelar os seis parâmetros — eles surgem em sequência, escalonados pelo grid. Em cada um, arraste o marcador para posicionar uma medida e ver onde ela cai na distribuição.<\u002Fp>\n    <div class=\"lp-exgrid\" id=\"perfil-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:28px;row-gap:30px;align-items:start;\">\n      <sc-for list=\"{{ explorerCards }}\" as=\"card\" hint-placeholder-count=\"6\">\n        <div class=\"reveal\" style=\"{{ card.cardStyle }}\">\n          <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:4px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--blue,#2e74ab);\">{{ card.key }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:500;color:var(--ink,#1b1b1a);\">{{ card.name }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--faint,#9b9b97);\">n = {{ card.n }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin:8px 0 4px;\">{{ card.chart }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ink,#1b1b1a);\">{{ card.readout }}<\u002Fspan>\n            <span style=\"{{ card.verdictStyle }}\">{{ card.verdictText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--hair,#efefea);font-size:13.5px;\">\n            <span style=\"color:var(--muted,#6f6f6c);\">Média ± DP <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink,#1b1b1a);\">{{ card.meanSd }}<\u002Fspan><\u002Fspan>\n            <span style=\"color:var(--blue,#2e74ab);\">Ref. <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;\">{{ card.ref }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"extremos\" class=\"lp-sec\" style=\"padding:96px 40px;background:var(--bg,#ffffff);transition:background .35s ease;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:18px;\">RELEVÂNCIA CLÍNICA · CÂMARA RASA<\u002Fdiv>\n    <h2 class=\"revealT lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:50px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:18px;\">Valores extremos e configuração de câmara rasa<\u002Fh2>\n    <p class=\"reveal\" style=\"font-size:21px;color:var(--muted,#5a5a57);line-height:1.5;max-width:820px;margin-bottom:44px;\">Além de descrever o perfil biométrico, o estudo quantifica a proporção de olhos com <strong style=\"color:var(--ink,#1b1b1a);font-weight:600;\">valores anatomicamente extremos<\u002Fstrong> de comprimento axial, câmara anterior e sua razão — configuração de relevância clínica por sua associação à predisposição anatômica ao <strong style=\"color:var(--ink,#1b1b1a);font-weight:600;\">fechamento angular primário<\u002Fstrong>. Aplicam-se limiares clássicos da literatura.<\u002Fp>\n    <div class=\"reveal lp-extgrid\" style=\"display:grid;grid-template-columns:1fr 380px;gap:56px;align-items:center;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--faint,#9b9b97);margin-bottom:2px;\">LIMIARES BIOMÉTRICOS<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;align-items:stretch;\">\n          <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-bottom:1px solid var(--line,#e0e0db);\">Comprimento axial <span style=\"color:var(--faint,#9b9b97);\">(AL)<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink,#1b1b1a);padding:22px 0;border-bottom:1px solid var(--line,#e0e0db);text-align:right;\">&lt; 22,80 mm<\u002Fdiv>\n          <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-bottom:1px solid var(--line,#e0e0db);\">Profundidade da câmara anterior <span style=\"color:var(--faint,#9b9b97);\">(ACD)<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink,#1b1b1a);padding:22px 0;border-bottom:1px solid var(--line,#e0e0db);text-align:right;\">&lt; 2,70 mm<\u002Fdiv>\n          <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;\">Razão ACD / AL<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink,#1b1b1a);padding:22px 0;text-align:right;\">&lt; 0,12<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg2,#f7f7f4);border:1px solid var(--line,#e8e8e3);border-radius:8px;padding:36px 34px;transition:background .35s ease,border-color .35s ease;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--faint,#6b6b67);margin-bottom:12px;\">PERFIL COMPLETO DE CÂMARA RASA<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:78px;font-weight:600;color:var(--blue,#2e74ab);line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;\">1,2%<\u002Fdiv>\n        <p style=\"font-size:18px;color:var(--body,#3a3a38);line-height:1.5;margin-top:16px;\">dos olhos (≥ 40 anos) reúnem os <strong style=\"color:var(--ink,#1b1b1a);font-weight:600;\">três critérios<\u002Fstrong> simultaneamente.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal lp-exttiles\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px;\">\n      <div style=\"border-top:3px solid var(--bfill,#3f86bb);padding:18px 4px 0;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:var(--ink,#1b1b1a);line-height:1;font-variant-numeric:tabular-nums;\">1,8%<\u002Fdiv>\n        <div style=\"font-size:15px;color:var(--muted,#5a5a57);margin-top:10px;line-height:1.4;\">ACD &lt; 2,70 mm<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid var(--bfill,#3f86bb);padding:18px 4px 0;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:var(--ink,#1b1b1a);line-height:1;font-variant-numeric:tabular-nums;\">2,2%<\u002Fdiv>\n        <div style=\"font-size:15px;color:var(--muted,#5a5a57);margin-top:10px;line-height:1.4;\">ACD / AL &lt; 0,12<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid var(--ofill,#d98f52);padding:18px 4px 0;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:var(--ink,#1b1b1a);line-height:1;font-variant-numeric:tabular-nums;\">33%<\u002Fdiv>\n        <div style=\"font-size:15px;color:var(--muted,#5a5a57);margin-top:10px;line-height:1.4;\">AL &lt; 22,80 mm — frequente, porém <span style=\"color:var(--otext,#9c5a1e);font-weight:600;\">pouco específico<\u002Fspan> (olhos curtos / hipermétropes)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal\" style=\"margin-top:34px;padding:20px 24px;background:var(--bg2,#f7f7f4);border-left:4px solid var(--ofill,#d98f52);border-radius:4px;transition:background .35s ease;\">\n      <p style=\"font-size:15.5px;color:var(--muted,#5a5a57);line-height:1.6;max-width:960px;\">Marcador biométrico de <strong style=\"color:var(--ink,#1b1b1a);font-weight:600;\">suspeição, não diagnóstico<\u002Fstrong> (sem gonioscopia). Para comparabilidade, a profundidade da câmara anterior foi harmonizada à convenção do estudo de referência, que inclui a espessura corneana central.<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"reveal\" style=\"font-size:13.5px;color:var(--faint,#9b9b97);margin-top:26px;max-width:960px;line-height:1.7;font-family:'IBM Plex Mono',monospace;\">LIN YW, WANG TH, HUNG PT. <span style=\"font-style:italic;\">Biometric study of acute primary angle-closure glaucoma.<\u002Fspan> J Formos Med Assoc. 1997;96(11):908–912. PMID 9409125.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"idade\" class=\"lp-sec\" style=\"padding:96px 40px;background:var(--bg2,#f7f7f4);border-top:1px solid var(--line,#e8e8e3);transition:background .35s ease;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:18px;\">RESULTADOS · IDADE<\u002Fdiv>\n    <h2 class=\"revealT lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:50px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:18px;\">O cristalino espessa, a câmara anterior reduz<\u002Fh2>\n    <p class=\"reveal\" style=\"font-size:21px;color:var(--muted,#5a5a57);line-height:1.5;max-width:780px;margin-bottom:30px;\">Dois achados acoplados na coorte de 40 anos ou mais. Alterne entre os parâmetros para ver a tendência com a idade.<\u002Fp>\n    <div class=\"reveal\" style=\"display:flex;gap:10px;margin-bottom:26px;\">\n      <button class=\"lp-tab\" sc-camel-on-click=\"{{ onAgeLT }}\" style=\"{{ ageLTStyle }}\">LT · cristalino<\u002Fbutton>\n      <button class=\"lp-tab\" sc-camel-on-click=\"{{ onAgeACD }}\" style=\"{{ ageACDStyle }}\">ACD · câmara anterior<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"reveal lp-grid2\" style=\"display:grid;grid-template-columns:1fr 320px;gap:44px;align-items:center;\">\n      <div class=\"lp-card\" style=\"background:var(--panel,#ffffff);border:1px solid var(--line,#e8e8e3);border-radius:6px;padding:26px 30px;transition:background .35s ease,border-color .35s ease;\">{{ ageChart }}<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:{{ ageColor }};line-height:1;letter-spacing:-1px;\">{{ agePer }}<\u002Fdiv>\n        <div style=\"font-size:18px;color:var(--muted,#5a5a57);margin-top:14px;line-height:1.45;\">{{ ageDesc }}<\u002Fdiv>\n        <div style=\"display:flex;gap:24px;margin-top:24px;font-family:'IBM Plex Mono',monospace;\">\n          <div><div style=\"font-size:13px;color:var(--faint,#9b9b97);letter-spacing:1px;\">SPEARMAN ρ<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:var(--ink,#1b1b1a);margin-top:4px;\">{{ ageRho }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:13px;color:var(--faint,#9b9b97);letter-spacing:1px;\">VALOR p<\u002Fdiv><div style=\"font-size:24px;font-weight:600;color:var(--ink,#1b1b1a);margin-top:4px;\">{{ ageP }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px;padding:18px 20px;background:var(--bg2,#f7f7f4);border-left:4px solid var(--ofill,#d98f52);font-size:16px;color:var(--body,#3a3a38);line-height:1.45;\">São acopladas: o segmento anterior <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;\">ACD + LT<\u002Fspan> permanece estável.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"astig\" aria-label=\"Resultados · Astigmatismo\">\n  <div id=\"astig-track\" style=\"position:relative;height:250vh;background:var(--bg2,#f7f7f4);border-top:1px solid var(--line,#e8e8e3);border-bottom:1px solid var(--line,#e8e8e3);transition:background .35s ease;\">\n    <div id=\"astig-stage\" style=\"position:sticky;top:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:80px 40px;box-sizing:border-box;\">\n      <div style=\"max-width:1180px;margin:0 auto;width:100%;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:16px;\">RESULTADOS · ASTIGMATISMO<\u002Fdiv>\n        <h2 class=\"lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:46px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:14px;max-width:820px;\">Demanda por correção do astigmatismo<\u002Fh2>\n        <p style=\"font-size:20px;color:var(--muted,#5a5a57);line-height:1.5;max-width:760px;margin-bottom:40px;\">Role para percorrer os limiares cumulativos — a partir de 1,0 D costuma-se considerar correção com LIO tórica. Você também pode clicar em uma barra.<\u002Fp>\n        <div class=\"lp-grid2\" style=\"display:grid;grid-template-columns:1fr 400px;gap:56px;align-items:center;\">\n          <div class=\"lp-card\" style=\"background:var(--panel,#ffffff);border:1px solid var(--line,#e8e8e3);border-radius:8px;padding:34px 38px;transition:background .35s ease,border-color .35s ease;\">{{ astigChart }}<\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1.5px;color:var(--faint,#9b9b97);margin-bottom:8px;\">ASTIGMATISMO CORNEANO {{ astigLab }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:600;color:var(--otext,#c2762f);line-height:1;letter-spacing:-2px;\">{{ astigPct }}%<\u002Fdiv>\n            <div style=\"font-size:20px;color:var(--body,#3a3a38);margin-top:12px;\">{{ astigCount }} de 460 olhos<\u002Fdiv>\n            <div style=\"margin-top:32px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1.5px;color:var(--faint,#9b9b97);margin-bottom:14px;\">ORIENTAÇÃO DO EIXO<\u002Fdiv>\n            <div style=\"display:flex;height:46px;border-radius:4px;overflow:hidden;\">\n              <div style=\"width:48%;background:#2c6c98;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;\">48%<\u002Fdiv>\n              <div style=\"width:38%;background:#8fb0ca;display:flex;align-items:center;justify-content:center;color:#10293b;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;\">38%<\u002Fdiv>\n              <div style=\"width:14%;background:#d98f52;display:flex;align-items:center;justify-content:center;color:#1b1b1a;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;\">14%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:18px;margin-top:12px;font-size:14px;color:var(--muted,#6f6f6c);flex-wrap:wrap;\">\n              <span><span style=\"color:var(--blue,#2e74ab);font-weight:600;\">■<\u002Fspan> Contra a regra<\u002Fspan>\n              <span><span style=\"color:#6a96b8;font-weight:600;\">■<\u002Fspan> A favor da regra<\u002Fspan>\n              <span><span style=\"color:var(--otext,#9c5a1e);font-weight:600;\">■<\u002Fspan> Oblíquo<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;margin-top:32px;\">\n              <sc-for list=\"{{ astigDots }}\" as=\"d\" hint-placeholder-count=\"5\"><span style=\"{{ d.style }}\"><\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--faint,#9b9b97);\">↓ ROLE PARA PERCORRER OS LIMIARES<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"literatura\" class=\"lp-sec\" style=\"padding:96px 40px;background:var(--bg,#ffffff);transition:background .35s ease;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:18px;\">DISCUSSÃO · LITERATURA<\u002Fdiv>\n    <h2 class=\"revealT lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:50px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:18px;\">Como nos comparamos<\u002Fh2>\n    <p class=\"reveal\" style=\"font-size:21px;color:var(--muted,#5a5a57);line-height:1.5;max-width:780px;margin-bottom:30px;\">Média ± 1 DP frente a séries nacionais e internacionais. A linha tracejada marca o valor do presente estudo.<\u002Fp>\n    <div class=\"reveal\" style=\"display:flex;gap:10px;margin-bottom:26px;\">\n      <sc-for list=\"{{ litItems }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button class=\"lp-tab\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"reveal lp-card lp-litcard\" style=\"background:var(--panel,#ffffff);border:1px solid var(--line,#e8e8e3);border-radius:6px;padding:24px 26px;transition:background .35s ease,border-color .35s ease;\">{{ litChart }}<\u002Fdiv>\n    <p class=\"reveal\" style=\"font-size:15px;color:var(--faint,#9b9b97);margin-top:18px;max-width:920px;line-height:1.6;\"><span style=\"color:var(--otext,#9c5a1e);font-weight:600;\">■ presente estudo<\u002Fspan> · <span style=\"color:var(--blue,#2e74ab);font-weight:600;\">◆ média das demais séries<\u002Fspan> · ○ séries da literatura. A barra horizontal é ± 1 DP; a linha tracejada marca a média do presente estudo. A ampla sobreposição dos desvios mostra que grande parte das diferenças entre coortes cabe na variação biológica.<\u002Fp>\n    <div class=\"reveal lp-litgrid\" style=\"display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:stretch;margin-top:34px;\">\n      <div style=\"display:flex;flex-direction:column;justify-content:center;\">\n        <div style=\"background:var(--bg2,#f7f7f4);border:1px solid var(--line,#e8e8e3);border-radius:8px;padding:24px 26px;transition:background .35s ease,border-color .35s ease;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--faint,#6b6b67);margin-bottom:8px;\">Δ VS. MÉDIA DAS DEMAIS<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',serif;font-size:42px;font-weight:600;color:var(--blue,#2e74ab);line-height:1;font-variant-numeric:tabular-nums;\">{{ litRead.deltaText }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted,#6f6f6c);margin-top:8px;\">{{ litRead.seriesText }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px 30px;background:var(--panel,#ffffff);border:1px solid var(--line,#e8e8e3);border-left:4px solid var(--ofill,#d98f52);border-radius:6px;display:flex;flex-direction:column;justify-content:center;transition:background .35s ease,border-color .35s ease;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--otext,#9c5a1e);font-weight:600;margin-bottom:14px;\">LEITURA DO PARÂMETRO<\u002Fdiv>\n        <p style=\"font-size:19px;color:var(--body,#3a3a38);line-height:1.55;\">{{ litRead.note }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"reveal\" style=\"font-size:15px;color:var(--faint,#6b6b67);margin-top:24px;max-width:900px;line-height:1.55;\">As séries externas combinam estudos de base populacional e coortes clínicas pré-operatórias de catarata, com estruturas etárias e critérios de seleção distintos. A comparação é, portanto, descritiva: diferenças de poucos décimos refletem tanto biologia quanto desenho de amostragem, não necessariamente um achado populacional.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"metodo\" class=\"lp-sec\" style=\"background:var(--bg2,#f7f7f4);padding:96px 40px;border-top:1px solid var(--line,#e8e8e3);transition:background .35s ease;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div class=\"reveal\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--blue,#2e74ab);font-weight:600;margin-bottom:18px;\">MÉTODOS<\u002Fdiv>\n    <h2 class=\"revealT lp-h2\" style=\"font-family:'IBM Plex Serif',serif;font-size:50px;font-weight:600;letter-spacing:-1px;color:var(--ink,#1b1b1a);margin-bottom:40px;\">Como o estudo foi feito<\u002Fh2>\n    <div class=\"reveal lp-methrow\" style=\"display:grid;grid-template-columns:240px 1fr;column-gap:40px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--blue,#2e74ab);font-weight:600;padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">Fonte<\u002Fdiv>\n      <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">Laudos consecutivos da 1ª consulta · janeiro–agosto de 2021<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--blue,#2e74ab);font-weight:600;padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">Coorte<\u002Fdiv>\n      <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">490 olhos fácicos de 296 pacientes, idade ≥ 40 anos (251 OD · 239 OS)<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--blue,#2e74ab);font-weight:600;padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">Análise<\u002Fdiv>\n      <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-top:1px solid var(--line,#e0e0db);\">Descritiva por olho · Mann-Whitney, Kruskal-Wallis, Spearman · Python (pandas, scipy)<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--blue,#2e74ab);font-weight:600;padding:22px 0;border-top:1px solid var(--line,#e0e0db);border-bottom:1px solid var(--line,#e0e0db);\">Referência<\u002Fdiv>\n      <div style=\"font-size:19px;color:var(--body,#3a3a38);padding:22px 0;border-top:1px solid var(--line,#e0e0db);border-bottom:1px solid var(--line,#e0e0db);\">Percentis 2,5–97,5 no núcleo normativo (435 olhos) · IC 90% por reamostragem · CLSI EP28-A3<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"reveal\" style=\"font-size:16px;color:var(--faint,#9b9b97);margin-top:26px;max-width:920px;line-height:1.5;\">Análise preliminar de uma série consecutiva em andamento. Estudo de centro e equipamento únicos — os intervalos são referência local/assistencial, não normas populacionais. As distribuições interativas representam média, desvio e correlação reportados.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<footer class=\"lp-sec\" style=\"background:#141414;color:#ededed;padding:70px 40px 48px;\">\n  <div style=\"max-width:1180px;margin:0 auto;\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:3px;color:#7aa6c6;font-weight:600;margin-bottom:18px;\">HOSPITAL GERAL DE FORTALEZA · SERVIÇO DE OFTALMOLOGIA<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Serif',serif;font-size:38px;font-weight:600;margin-bottom:30px;max-width:760px;line-height:1.1;\">O olho adulto em números<\u002Fdiv>\n    <a href=\"assets/artigo-completo.pdf\" download=\"\" style=\"display:inline-flex;align-items:center;gap:11px;background:#2c6c98;color:#ffffff;text-decoration:none;font-size:17px;font-weight:600;padding:14px 26px;border-radius:6px;margin-bottom:46px;transition:background .2s ease;\" sc-camel-on-mouse-over=\"this.style.background='#2e74ab';\" sc-camel-on-mouse-out=\"this.style.background='#3f86bb';\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.
